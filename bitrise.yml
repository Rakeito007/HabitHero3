format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  ios-build:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@6: {}
    - cache-pull@2: {}
    - npm@6:
        inputs:
        - command: install
    - npm@6:
        inputs:
        - command: install -g @expo/cli
    - expo-build-ios@1:
        inputs:
        - platform: ios
        - build_type: archive
        - expo_token: $EXPO_TOKEN
    - cache-push@2: {}
    - deploy-to-bitrise-io@2: {}
